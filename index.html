    <script>
      // Apply the theme before first paint to avoid a light flash.
      // Saved choice wins; otherwise follow the OS. Key must match theme-provider.tsx.
      (function () {
        try {
          var stored = localStorage.getItem("resumeXportfolio-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
